<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taiwan Weather Dashboard Widget</title>
  <style>
    html, body { margin: 0; padding: 0; background: #191919; overflow: hidden; }
    #widget { width: 100%; overflow: hidden; }
    #widget iframe {
      width: 125%;
      height: 600px;
      border: 0;
      transform: scale(0.8);
      transform-origin: 0 0;
      display: block;
    }
  </style>
</head>
<body>
  <div id="widget"></div>

  <script>
    // Meteoblue widget URLs per location.
    // Replace the {{YOUR_...}} placeholders with your own Meteoblue widget credentials.
    const widgets = {
      taipei: "https://www.meteoblue.com/en/weather/widget/three/taipei_taiwan_1668341?geoloc=fixed&nocurrent=1&noforecast=0&tempunit=CELSIUS&windunit=KILOMETER_PER_HOUR&days=4&layout=dark&user_key={{YOUR_USER_KEY}}&embed_key={{YOUR_EMBED_KEY}}&sig={{YOUR_SIG}}",
      alishan: "https://www.meteoblue.com/en/weather/widget/three/alishan_taiwan_1679029?geoloc=fixed&nocurrent=1&noforecast=0&tempunit=CELSIUS&windunit=KILOMETER_PER_HOUR&days=4&layout=dark&user_key={{YOUR_USER_KEY}}&embed_key={{YOUR_EMBED_KEY}}&sig={{YOUR_SIG}}",
      xiaoliuqiu: "https://www.meteoblue.com/en/weather/widget/three/baishawei_taiwan_1671114?geoloc=fixed&nocurrent=1&noforecast=0&tempunit=CELSIUS&windunit=KILOMETER_PER_HOUR&days=4&layout=dark&user_key={{YOUR_USER_KEY}}&embed_key={{YOUR_EMBED_KEY}}&sig={{YOUR_SIG}}",
      kaohsiung: "https://www.meteoblue.com/en/weather/widget/three/kaohsiung-city_taiwan_1673820?geoloc=fixed&nocurrent=1&noforecast=0&tempunit=CELSIUS&windunit=KILOMETER_PER_HOUR&days=4&layout=dark&user_key={{YOUR_USER_KEY}}&embed_key={{YOUR_EMBED_KEY}}&sig={{YOUR_SIG}}",
      hualien: "https://www.meteoblue.com/en/weather/widget/three/hualien-city_taiwan_1674504?geoloc=fixed&nocurrent=1&noforecast=0&tempunit=CELSIUS&windunit=KILOMETER_PER_HOUR&days=4&layout=dark&user_key={{YOUR_USER_KEY}}&embed_key={{YOUR_EMBED_KEY}}&sig={{YOUR_SIG}}"
    };

    // Itinerary schedule (dates in Asia/Taipei, format YYYY-MM-DD, both ends inclusive).
    // NOTE: These are example dates. Replace them with your own itinerary.
    const SCHEDULE = [
      { from: "2030-01-01", to: "2030-01-03", location: "taipei" },
      { from: "2030-01-04", to: "2030-01-05", location: "alishan" },
      { from: "2030-01-06", to: "2030-01-07", location: "xiaoliuqiu" },
      { from: "2030-01-08", to: "2030-01-08", location: "kaohsiung" },
      { from: "2030-01-09", to: "2030-01-11", location: "hualien" },
      { from: "2030-01-12", to: "2030-01-14", location: "taipei" }
    ];
    const DEFAULT_LOCATION = "taipei";

    // Current date in the target timezone (Asia/Taipei), formatted as YYYY-MM-DD
    function taipeiDate() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Taipei",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());
      const values = {};
      for (const part of parts) {
        if (part.type !== "literal") values[part.type] = part.value;
      }
      return `${values.year}-${values.month}-${values.day}`;
    }

    // Schedule-based location resolver
    function locationForDate(date) {
      const entry = SCHEDULE.find(item => date >= item.from && date <= item.to);
      return entry ? entry.location : DEFAULT_LOCATION;
    }

    // Resolve location via URL parameter override (?location=hualien) or via the schedule
    function selectedLocation() {
      const params = new URLSearchParams(window.location.search);

      const override = params.get("location")?.toLowerCase();
      if (override && widgets[override]) return override;

      return locationForDate(taipeiDate());
    }

    // Render the Meteoblue iframe for the selected location
    function renderWidget() {
      const location = selectedLocation();
      const iframe = document.createElement("iframe");
      iframe.src = widgets[location];
      iframe.frameBorder = "0";
      iframe.scrolling = "no";
      iframe.allowTransparency = "true";
      iframe.sandbox = "allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox";
      document.getElementById("widget").replaceChildren(iframe);
    }

    renderWidget();

    let lastLocation = selectedLocation();

    // Polling loop: re-render only when the schedule moves on to another location
    setInterval(() => {
      const currentLocation = selectedLocation();

      if (currentLocation !== lastLocation) {
        lastLocation = currentLocation;
        renderWidget();
      }
    }, 60000);
  </script>
</body>
</html>
